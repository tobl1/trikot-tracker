# =====================================================================
# Trikot-Tracker: Suchliste
# Groß/Kleinschreibung und Akzente (é, ć, š, ü ...) werden automatisch ignoriert.
# Alle Begriffe werden als ganze Wörter gesucht ("rodri" trifft nicht "rodrigo").
# =====================================================================

groessen:
  # Erkannt werden: XL, XXL, 2XL, X-Large, XX-Large, Extra Large
  # Kinder- und Damengrößen werden ausgeschlossen:
  ausschliessen: ["boys", "boy", "youth", "kids", "kid", "junior", "jnr", "jr",
                  "enfant", "enfants", "kinder", "nino", "ninos", "child", "children",
                  "infant", "baby", "yxl", "xlb", "womens", "women", "ladies", "damen",
                  "young xl", "young xxl", "young 2xl",
                  "damska", "dziecieca", "femme", "mujer", "donna", "feminina", "feminino",
                  "infantil", "bambino", "dames", "childs", "child's", "ans", "jongens", "kinderen"]

# Preisgrenze in Euro: teurere Treffer gibt es nicht als Push und sie sind im Dashboard
# standardmäßig ausgeblendet. Ausnahmen = Labels mit eigener Grenze (0 = ohne Grenze).
# Thiago bis 200 € (Nutzer 09.10.2026: auch Matchworn/Player Issue, "200 ist echt maximal"), vorher 199 bzw. ohne.
# Seit 09.10.2026 fliegt alles darüber konsequent raus (nicht mehr im Dashboard, kein Push); fällt der Preis später
# unter die Grenze, kommt der Treffer als Push
preisgrenze:
  max_eur: 150
  ausnahmen: {"Thiago": 200}

# Produkte, die keine Trikots sind oder nicht gewünscht sind
produkt_ausschluss: [# England grundsätzlich nicht (Nutzer 08.10.2026, betraf vor allem WM 2006)
                     "england", "anglia", "inglaterra", "angleterre", "inghilterra", "engeland",
                     # Dortmund grundsätzlich nicht (eBay-Meldung 09.10.2026 bei Perišić: "BVB NEIN")
                     "dortmund", "bvb",
                     "shorts", "socks", "sock", "jacket", "track top", "tracksuit",
                     "hoodie", "sweatshirt", "sweater", "pants", "trousers", "scarf", "bag",
                     "cap", "hat", "programme", "ball", "boots", "poster", "sticker", "mug",
                     "keyring", "towel", "pennant", "framed", "cushion", "goalkeeper",
                     "torwart", "portero", "gk", "keeper", "goal keeper", "tracktop", "track jacket",
                     "keepersshirt", "keepershirt", "torwarttrikot", "portiere", "gardien", "goleiro", "training", "pre-match", "prematch",
                     "warm up", "polo", "t-shirt", "tee", "bib", "stutzen", "jacke", "schal",
                     # Trainingsshirts in anderen Sprachen
                     "treino", "entrenamiento", "entreno", "allenamento", "entrainement",
                     "trening", "trainingsshirt", "trainingstrikot",
                     "trainingsjacke", "trainingsanzug", "trainingsoberteil", "regenjacke", "allwetterjacke",
                     "prasentationsjacke", "aufwarmshirt", "giacca", "giubbotto", "felpa", "veste",
                     "chaqueta", "chamarra", "sudadera", "chandal", "survetement", "kurtka", "bluza",
                     # Pullis und Hosen (Probelauf 05.10.2026: "Sweat Top", "Hooded Top", "Pantaloncino" = Shorts)
                     "sweat", "sweat top", "hooded", "pantaloncino", "pantaloncini", "pantalon", "pantalones", "pantaloni",
                     # Mäntel und Jacken (06.10.2026: CFS "2012-13 Barcelona Nike Reversible Padded Bench Coat" als Barça-Treffer)
                     "coat", "bench coat", "anorak", "parka", "windbreaker", "rain jacket", "gilet", "manteau",
                     "mantel", "cappotto", "abrigo", "drill top",
                     # andere Vereine mit gleichem Namen
                     "barcelona sc", "barcelona s.c.", "barcelona sporting", "guayaquil", "espanyol"]

# Ausrüster: Sondertrikots mit "marke" zählen nicht, wenn im Titel ein ANDERER Ausrüster steht
# (Probelauf 05.10.2026: "Puma Italia TOTTI Euro 2004 Portugal" galt als Nike-T90-Trikot Portugal)
marken: ["nike", "adidas", "puma", "umbro", "kappa", "diadora", "lotto", "le coq sportif", "reebok", "hummel",
         "joma", "errea", "macron", "uhlsport", "jako", "erima", "asics", "mizuno", "fila", "admiral", "new balance"]

# Nachbauten: neu produzierte Trikots, offizielle Neuauflagen, reine Flocksätze
# (nicht "replica", das heißt in UK einfach Fan-Trikot)
nachbau: ["reissue", "re-issue", "remake", "reedition", "reedicion", "riedizione",
          "repro", "score draw", "nameset"]

# Kategorien, in denen Neuauflagen ausdrücklich erwünscht sind (im Dashboard als "NEUAUFLAGE")
nachbau_erlaubt_fuer: ["Nike Total 90 (2004-06)"]

# Ausnahme: Original-Trikot mit NACHGEDRUCKTEM Flock ist für diese Labels erwünscht (im Dashboard
# als "Repro-Flock" gekennzeichnet). Erkannt an den Mustern; FYJ-"Reissue" zählt bei diesen Labels auch
repro_flock:
  labels: ["Thiago"]
  muster: ["repro flock", "flock repro", "repro print", "repro printing", "reprinted", "re-printed",
           "re printed", "flocage reproduction", "reproduction flocage", "flocage repro", "repro flocage",
           "nameset remake", "remake nameset", "remake print", "repro nameset", "repro name"]

# Hersteller, die auf ein inoffizielles Fan-Produkt hindeuten (aus den Produktdaten der Shop-Seite,
# z. B. classic-shirts.com "Producer: Official")
hersteller_ausschluss: ["official"]

# Einzelne Artikel gezielt ausblenden (vom Nutzer gemeldete Fehltreffer)
ausschluss_urls:
  - https://www.vintagefootballarea.com/products/2010-11-espagne-xl-4          # Trainingsjacke
  - https://classic-shirts.com/product-eng-350953-2010-11-BARCELONA-SHIRT-XL.html  # Nike-Trainingsshirt
  - https://classic-shirts.com/product-eng-362874-2022-23-BARCELONA-F-DE-JONG-SHIRT-XL.html  # Hersteller "Official"

# ---------------------------------------------------------------------
# Spieler: Treffer = Suchbegriff im Titel UND kein Ausschlusswort
# "vereine" ist ein STRIKTER Filter: ist er gesetzt, zählen nur Trikots
# dieser Vereine/Nationalteams. Ohne "vereine" zählt jedes Trikot.
# prioritaet "hoch" = auffällige Push-Nachricht + zusätzliche Checks alle 3 Std.
# ---------------------------------------------------------------------
spieler:

  - name: Thiago
    prioritaet: hoch
    suche: ["thiago", "alcantara"]
    ausschluss: ["thiago silva", "t. silva", "silva", "motta", "almada", "mendes",
                 "neves", "djalo", "igor thiago", "galhardo", "messi", "rafinha"]
    vereine: ["barcelona", "barca", "barcelone", "barcellona", "bayern", "munich", "munchen", "liverpool",
              "spain", "spanien", "espana", "spanje", "espagne", "spagna", "espanha", "hiszpania"]

  - name: Verratti
    suche: ["verratti"]

  - name: Perišić
    suche: ["perisic"]

  - name: Olić
    suche: ["olic"]
    vereine: ["bayern", "munich", "munchen", "hamburg", "hamburger", "hsv", "croatia", "kroatien", "hrvatska", "kroatie", "croatie", "croazia", "croacia", "chorwacja"]

  - name: Van der Vaart
    suche: ["van der vaart", "vd vaart"]

  - name: Van Nistelrooy
    suche: ["van nistelrooy", "van nistelrooij", "nistelrooy"]

  - name: Henry
    suche: ["henry"]
    vereine: ["arsenal"]

  - name: Torres (Fernando)
