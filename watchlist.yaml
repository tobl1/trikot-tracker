  - name: Alonso (Xabi)
    suche: ["xabi alonso", "alonso"]
    ausschluss: ["marcos alonso", "m. alonso"]
    vereine: ["real sociedad", "liverpool", "real madrid", "bayern", "munich", "munchen",
              "spain", "spanien", "espana", "spanje", "espagne", "spagna", "espanha", "hiszpania"]

  - name: Cavani
    suche: ["cavani"]

  - name: Forlán
    suche: ["forlan"]

  - name: Ribéry
    suche: ["ribery"]

  - name: Juninho (Pernambucano)
    suche: ["juninho"]
    ausschluss: ["paulista"]
    vereine: ["lyon"]      # Nutzer 08.10.2026: nur Lyon (nicht Vasco, Brasilien, Al-Gharafa)

  - name: Benzema
    suche: ["benzema"]

  - name: Kroos
    suche: ["kroos"]
    ausschluss: ["felix kroos", "leverkusen", "bayer 04"]      # Nutzer: Kroos niemals Leverkusen

  - name: Rodri
    suche: ["rodri"]
    ausschluss: ["rodrigo", "rodrigues", "rodriguez"]
