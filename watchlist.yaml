# ---------------------------------------------------------------------
# Sondertrikots (Thiago-Bezug)
#   verein:       Namen, von denen mindestens einer im Titel stehen muss
#   saisons:      z. B. "2010/11" erkennt auch 2010-11, 2010/2011, 10/11 usw.
#   jahre:        einzelne Jahreszahlen, z. B. "2014"
#   varianten:    alle | home | away | third (mehrere möglich)
#   stichwoerter: mindestens eins muss vorkommen ...
#   kombi:        ... oder ein Begriff aus "begriffe" UND eine Farbe
#   suchanfragen: was in den Shop-Suchen eingegeben wird
#   ausschluss:   Begriffe, bei denen dieses Sondertrikot NICHT zählt
#   codes:        Hersteller-Artikelcodes; steht einer im Titel oder in der Beschreibung, zählt das
#                 Trikot auch ohne Varianten- oder Saisonangabe
# ---------------------------------------------------------------------
sondertrikots:

  - name: "Barça 2008-2013"         # 08/09 und 09/10 seit 05.10.2026 (Nutzer), alle Varianten
    prioritaet: hoch
    verein: ["barcelona", "barca", "barcelone", "barcellona"]
    saisons: ["2008/09", "2009/10", "2010/11", "2011/12", "2012/13"]
    varianten: alle
    suchanfragen: ["barcelona 2008", "barcelona 2009", "barcelona 2010", "barcelona 2011", "barcelona 2012"]
    codes: ["419877-486", "478323-410"]   # Nike Heim 11/12 und 12/13 (belegt aus Angeboten, 05.10.2026)

  # Zwei Einträge, ein Label: das grüne Wiesn-Trikot 2021/22 und das Oktoberfest-Trikot 2013/14 (Thiagos erste
  # Bayern-Saison, Nutzer 05.10.2026). Das 21/22-Trikot ist extrem selten (FYJ: in keiner Größe vorhanden)
  - name: "Bayern Wiesn-Trikot"
    prioritaet: hoch
    verein: ["bayern"]            # bewusst ohne "München", sonst träfe es auch 1860-Wiesn-Trikots
    saisons: ["2021/22"]
    jahre: ["2021"]
    varianten: alle
    stichwoerter: ["oktoberfest", "wiesn", "octoberfest", "wiesntrikot", "oktoberfesttrikot", "wiesn-trikot"]
    # "third", "fourth" usw. nur zusammen mit einer Farbe, sonst würde
    # auch das reguläre Third-Trikot 21/22 gemeldet.
    # Achtung: 2023/24 war ebenfalls grün, daher nur 21/22 bzw. 2021
    kombi:
      begriffe: ["third", "fourth", "4th", "special", "sondertrikot", "limited"]
      farbe: ["green", "grun", "gruen", "verde"]
    suchanfragen: ["bayern oktoberfest", "bayern wiesn", "bayern 2021"]

  - name: "Bayern Wiesn-Trikot"   # Oktoberfest 2013/14 (Trikot, keine Jacke: "jacke", "track jacket" usw. sind ausgeschlossen)
    prioritaet: hoch
    verein: ["bayern"]
    saisons: ["2013/14"]
    jahre: ["2013"]
    varianten: alle
    stichwoerter: ["oktoberfest", "wiesn", "octoberfest", "wiesntrikot", "oktoberfesttrikot", "wiesn-trikot"]
    suchanfragen: ["bayern oktoberfest"]

  - name: "Liverpool Away 2021/22"
    prioritaet: hoch
    verein: ["liverpool"]
    saisons: ["2021/22"]
    varianten: [away]
    suchanfragen: ["liverpool 2021"]

  - name: "Liverpool Third 2022/23"
    prioritaet: hoch
    verein: ["liverpool"]
    saisons: ["2022/23"]
    varianten: [third]
    codes: ["DM1835-377"]      # Nike-Artikelcode, zählt auch ohne "Third" im Titel (z. B. classic-shirts)
    suchanfragen: ["liverpool 2022"]

  - name: "Spanien 2010/2011"
    prioritaet: hoch
    verein: ["spain", "spanien", "espana", "spanje", "espagne", "spagna", "espanha", "hiszpania"]
    jahre: ["2010", "2011"]
    # spanische Vereine und Inseln sind nicht die Nationalmannschaft (eBay-Meldung 09.10.2026: "Lanzarote Trikot")
    ausschluss: ["lanzarote", "tenerife", "teneriffa", "las palmas", "canarias", "mallorca", "ibiza", "menorca", "betis",
                 "sevilla", "valencia", "villarreal", "celta", "deportivo", "malaga", "osasuna", "getafe", "levante",
                 "espanyol", "granada", "almeria", "cadiz", "rayo", "alaves", "eibar", "leganes", "zaragoza", "oviedo",
                 "gijon", "racing", "numancia", "athletic", "bilbao", "sociedad", "atletico", "real madrid", "barcelona"]
    varianten: [home, away]
    suchanfragen: ["spain 2010", "spain 2011"]
    codes: ["P47902"]                     # adidas Heim 2010/11 (belegt aus Angeboten, 05.10.2026)

  - name: "Spanien 2014"
    prioritaet: hoch
    verein: ["spain", "spanien", "espana", "spanje", "espagne", "spagna", "espanha", "hiszpania"]
    jahre: ["2014"]
