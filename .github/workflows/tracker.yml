name: Trikot-Tracker

on:
  schedule:
    # Hauptauslöser ist cron-job.org (Gesamt-Run 5:30, Schnell-Run 9:45/15:45/21:45, Drop-Run 9-23 Uhr zu den
    # Minuten 5/20/35/50, jeweils deutsche Zeit). Die Zeitpläne hier sind nur Rückfall (--rueckfall), laufen bewusst
    # später. Kein Rückfall für Drop-Runs: GitHub hält nur EINEN wartenden Run, ein zusätzlicher Start verdrängt ihn.
    - cron: "30 5 * * *"     # Rückfall Gesamt-Run (7:30 Sommerzeit)
    - cron: "15 9,15,21 * * *"   # Rückfall Schnell-Run (11:15/17:15/23:15 Sommerzeit, 10:15/16:15/22:15 Winterzeit)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = alles, priority = Schnellcheck, drop = nur fällige Drops, droptest = Drop-Run für alle Shops, test = nur Test-Push an die App"
        type: choice
        options: [full, priority, drop, droptest, test]
        default: full
      zweig:
        description: "Daten-Zweig (nur zum Testen ändern, z. B. daten-test)"
        type: string
        default: daten
      stumm:
        description: "Probelauf: keine Pushes, keine Issues schließen, kein Dashboard"
        type: boolean
        default: false

concurrency:
  # eigene Warteschlange je Daten-Zweig: Probeläufe auf daten-test blockieren die echten Runs nicht
  group: trikot-tracker-${{ inputs.zweig || 'daten' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write          # Meldungen aus dem Dashboard lesen und nach Übernahme schließen
  actions: write         # Dashboard-Workflow anstoßen

env:
  ZWEIG: ${{ inputs.zweig || 'daten' }}
  TRIKOT_DATEN: ${{ github.workspace }}/daten
  # stellt "pushen" bereit: git push mit bis zu 5 Versuchen. Am 07.10.2026 scheiterten zwei Runs an einem einmaligen
  # "Internal Server Error" von GitHub beim Push, das Run-Ergebnis war verloren
  BASH_ENV: ${{ github.workspace }}/.github/pushen.sh

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      geaendert: ${{ steps.speichern.outputs.geaendert }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Immer den NEUESTEN Stand des Zweigs holen, nicht den beim Auslösen. Sonst rechnet ein Run,
          # der hinter einem anderen gewartet hat, mit veraltetem Code
          ref: ${{ github.ref_name }}

      - name: Daten-Zweig holen
        # Zustand, Berichte und Dashboard-Daten liegen auf einem eigenen Zweig: Code-Änderungen auf main und
        # die Ergebnisse der Runs kommen sich so nie in die Quere
        uses: actions/checkout@v6
        with:
          ref: ${{ env.ZWEIG }}
          path: daten

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest==9.1.1

      - name: Tests
        # Schlagen Tests fehl, läuft der Tracker gar nicht erst (alter, funktionierender Stand bleibt)
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: Modus bestimmen
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 5 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=priority" >> "$GITHUB_OUTPUT"
          fi

      - name: Tracker ausführen
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          ARGS="--mode $MODE"
          if [ "$MODE" = "droptest" ]; then ARGS="--mode drop --alle"; fi
          # Start über den GitHub-Zeitplan = Rückfall: läuft nur, wenn cron-job.org den Run nicht schon erledigt hat
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --rueckfall"; fi
          if [ "${{ inputs.stumm }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python tracker.py $ARGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}           # eBay (offizielle Schnittstelle), nie ausgeben
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}   # auch Schlüssel für den verschlüsselten eBay-Zustand
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Ergebnisse speichern
        id: speichern
        working-directory: daten
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "trikot-tracker"
          git config user.email "trikot-tracker@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "geaendert=nein" >> "$GITHUB_OUTPUT"; exit 0; fi
          STAMP="$(date -u +'%Y-%m-%d %H:%M') UTC"
          if [ "$MODE" = "full" ]; then
            # Einmal am Tag zusammenfassen: der Daten-Zweig besteht dann nur aus einem Commit, das Repo bleibt klein
            git checkout -q --orphan neu
            git commit -q -m "Daten nach dem Gesamt-Run $STAMP"
            git branch -q -M "$ZWEIG"
            pushen -f origin "$ZWEIG"
          else
            git commit -q -m "Run $MODE $STAMP"
            pushen origin "HEAD:$ZWEIG"
          fi
          echo "geaendert=ja" >> "$GITHUB_OUTPUT"

      - name: Dashboard anstoßen
        # Eigener Workflow statt Job hier drin: am 06.10.2026 hing der Pages-Job über eine Stunde im Status "waiting"
        # und blockierte damit alle folgenden Runs (Concurrency). So ist der Run sofort fertig
        if: steps.speichern.outputs.geaendert == 'ja' && env.ZWEIG == 'daten' && inputs.stumm != true
        continue-on-error: true   # Dashboard ist Beiwerk, der Run bleibt gültig
        run: gh workflow run dashboard.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auf das Dashboard warten
        # Pushes erst, wenn die neuen Daten online sind: sonst öffnet man die App und der Treffer fehlt noch (Nutzer
        # 15.10.2026). Nur wenn Pushes anstehen, höchstens 5 Min.; hängt Pages, gehen die Pushes trotzdem raus
        if: steps.speichern.outputs.geaendert == 'ja' && env.ZWEIG == 'daten' && inputs.stumm != true
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import json,sys; sys.exit(0 if json.load(open('daten/state/postausgang.json')) else 1)" 2>/dev/null || exit 0
          START=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)
          for i in 1 2 3 4 5 6; do
            ID=$(gh run list --workflow dashboard.yml --limit 3 --json databaseId,createdAt -q "[.[] | select(.createdAt >= \"$START\")][0].databaseId")
            [ -n "$ID" ] && [ "$ID" != "null" ] && break
            sleep 5
          done
          if [ -n "$ID" ] && [ "$ID" != "null" ]; then gh run watch "$ID" --interval 10 > /dev/null || true; fi
          sleep 15   # GitHub Pages braucht nach dem Deploy noch einen Moment

      - name: Pushes senden
        # Erst jetzt, nachdem gespeichert ist: scheitert das Speichern, geht nichts raus (keine doppelten Pushes)
        if: inputs.stumm != true
        run: python tracker.py --mode senden
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}   # Push direkt an die Dashboard-App

      - name: Versand speichern
        if: inputs.stumm != true
        working-directory: daten
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Pushes versendet"
            pushen origin "HEAD:$ZWEIG"
          fi

      - name: Drop-Run nachschieben
        # Die Drop-Runs von cron-job.org laufen erst ab 9 Uhr. Ist nach dem Gesamt-Run schon ein Drop fällig (z. B.
        # Nostalgic 17.10.2026 um 6 Uhr), startet hier direkt ein Drop-Run, ohne Extra-Auftrag bei cron-job.org
        if: steps.mode.outputs.mode == 'full' && env.ZWEIG == 'daten' && inputs.stumm != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAELLIG=$(python - <<'PY'
          from trikot import speicher
          from trikot.basis import now
          from trikot.rhythmus import drop_due
          status = speicher.load_json(speicher.STATUS_FILE, {})
          t = now()
          print(", ".join(f"{s['name']} {drop_due(s, status, t)}" for s in speicher.load_shops()["shops"]
                          if (s.get("plattform") or "auto").lower() not in ("aus", "fyj") and drop_due(s, status, t)))
          PY
          )
          # ab 9 Uhr übernimmt cron-job.org, ein zusätzlicher Start würde dort einen wartenden Run verdrängen
          if [ -n "$FAELLIG" ] && [ "$(TZ=Europe/Berlin date +%H)" -lt 9 ]; then echo "Fällig: $FAELLIG"; gh workflow run tracker.yml --ref main -f mode=drop; fi

      - name: Fehlschlag ins Fehler-Log
        if: failure()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          cd daten
          git config user.name "trikot-tracker"
          git config user.email "trikot-tracker@users.noreply.github.com"
          # halbfertige Ergebnisse des abgebrochenen Runs verwerfen, neuesten Stand holen
          git fetch -q origin "$ZWEIG" && git reset -q --hard "origin/$ZWEIG" && git clean -qfd
          cd ..
          python - <<'PY'
          import os, tracker
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          tracker.log_problems([("Workflow", f"Run abgebrochen ({os.environ.get('MODE') or '?'}), Details: {run}")],
                               os.environ.get("MODE") or "?", tracker.now().isoformat())
          PY
          cd daten
          git add state/fehlerlog.json FEHLER.md
          git commit -q -m "Fehler-Log: Run abgebrochen" && pushen origin "HEAD:$ZWEIG" || true
