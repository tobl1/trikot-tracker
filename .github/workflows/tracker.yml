name: Trikot-Tracker

on:
  schedule:
    - cron: "30 3 * * *"     # Gesamtlauf nachts 05:30 (Sommerzeit) bzw. 04:30 (Winterzeit), nach dem FYJ-Abgleich
    - cron: "45 7,13,19 * * *"   # Schnellcheck Thiago & Sondertrikots 3x täglich (09:45, 15:45, 21:45 Sommerzeit)
    - cron: "10,40 11-21 * * 4,5,6"   # Drop-Run Do bis Sa (Rückfall, GitHub ist oft stark verspätet; besser extern auslösen)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = alles, priority = Schnellcheck, drop = nur fällige Drops, test = nur Test-Push"
        type: choice
        options: [full, priority, drop, test]
        default: full

concurrency:
  group: trikot-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Modus bestimmen
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10,40 11-21 * * 4,5,6" ]; then
            echo "mode=drop" >> "$GITHUB_OUTPUT"
          else
            echo "mode=priority" >> "$GITHUB_OUTPUT"
          fi

      - name: Tracker ausführen
        run: python tracker.py --mode ${{ steps.mode.outputs.mode }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: Bildprüfung
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Ergebnisse speichern
        if: steps.mode.outputs.mode != 'test'
        run: |
          git config user.name "trikot-tracker"
          git config user.email "trikot-tracker@users.noreply.github.com"
          git add state TREFFER.md docs/treffer.json
          if ! git diff --cached --quiet; then
            git commit -m "Tracker-Lauf $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
