name: eBay-Test (temporär)

# Klärt Bauentscheidungen für die eBay-Anbindung. Gibt bewusst nur Statuscodes, Mengen und Kategorie-/Merkmalsnamen aus:
# Action-Logs sind öffentlich, eBay-Angebotsinhalte dürfen nicht veröffentlicht werden (API License Agreement §9.7, §17)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2
      - name: Browse API testen
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os, requests
          r = requests.post("https://api.ebay.com/identity/v1/oauth2/token", timeout=30,
                            auth=(os.environ["EBAY_CLIENT_ID"], os.environ["EBAY_CLIENT_SECRET"]),
                            data={"grant_type": "client_credentials", "scope": "https://api.ebay.com/oauth/api_scope"})
          print("Token: HTTP", r.status_code)
          H = {"Authorization": f"Bearer {r.json()['access_token']}", "X-EBAY-C-ENDUSERCTX": "contextualLocation=country=DE,zip=80331"}
          BASE = "buyingOptions:{FIXED_PRICE},deliveryCountry:DE"
          W = {"EU": ("EBAY_DE", 77, BASE + ",itemLocationRegion:EUROPEAN_UNION"),
               "UK": ("EBAY_GB", 3, BASE + ",itemLocationCountry:GB"),
               "UA": ("EBAY_DE", 77, BASE + ",itemLocationCountry:UA")}

          def parent(tree, market, q, name):
              r = requests.get(f"https://api.ebay.com/commerce/taxonomy/v1/category_tree/{tree}/get_category_suggestions",
                               headers={**H, "X-EBAY-C-MARKETPLACE-ID": market}, params={"q": q}, timeout=30)
              for s in r.json().get("categorySuggestions") or []:
                  for a in s.get("categoryTreeNodeAncestors", []):
                      if a["categoryName"] == name:
                          return a["categoryId"]
          CAT = {"EU": parent(77, "EBAY_DE", "fussball trikot", "Fußball-Trikots"),
                 "UK": parent(3, "EBAY_GB", "football shirt", "Football Shirts")}
          CAT["UA"] = CAT["EU"]
          print("Elternkategorien:", CAT)

          def search(w, q, cat=True, aspect=None, groups=None, limit=1):
              m, _, flt = W[w]
              p = {"q": q, "filter": flt, "limit": limit}
              if cat: p["category_ids"] = CAT[w]
              if aspect: p["aspect_filter"] = f"categoryId:{CAT[w]},{aspect}"
              if groups: p["fieldgroups"] = groups
              r = requests.get("https://api.ebay.com/buy/browse/v1/item_summary/search",
                               headers={**H, "X-EBAY-C-MARKETPLACE-ID": m}, params=p, timeout=30)
              d = r.json() if r.ok else {}
              if not r.ok: print("  FEHLER", w, q, aspect, r.status_code, r.text[:250])
              return d

          print("\n1) Mengen in der Trikot-Kategorie (EU / UK / UA)")
          for q in ["thiago", "alcantara", "henry", "torres", "kroos", "hamburg", "hsv", "barcelona 2012",
                    "spanien 2010", "spain 2010", "wm 2006", "world cup 2006", "oktoberfest"]:
              print(f"  {q:16}", [search(w, q).get("total", 0) for w in ("EU", "UK", "UA")])
          q_all = "(verratti, perisic, olic, vaart, nistelrooy, henry, torres, robben, alonso, cavani, forlan, ribery, " \
                  "juninho, benzema, kroos, rodri, valverde, vidal, kimmich, barella, grimaldo, jong, llorente, roberto)"
          print("  alle Spieler als Oder-Suche:", [search(w, q_all).get("total", 0) for w in ("EU", "UK", "UA")])

          print("\n2) Größen-Merkmal in der Kategorie (Name und Anzahl der Werte, 'thiago' EU und UK)")
          for w in ("EU", "UK"):
              d = search(w, "thiago", groups="ASPECT_REFINEMENTS")
              for a in (d.get("refinement") or {}).get("aspectDistributions", []):
                  if any(k in a.get("localizedAspectName", "") for k in ("röße", "Size", "Taglia")):
                      print(f"  {w} {a['localizedAspectName']}:", [(v["localizedAspectValue"], v["matchCount"]) for v in a.get("aspectValueDistributions", [])][:20])

          print("\n3) Größenfilter per aspect_filter")
          for w, asp in (("EU", "Größe:{XL|XXL}"), ("UK", "Size:{XL|XXL}")):
              print(f"  {w} thiago ohne/mit {asp}:", search(w, "thiago").get("total", 0), search(w, "thiago", aspect=asp).get("total", 0))
          PY
