name: eBay-Test (temporär)

# Prüft die Kontingent-Abfrage. Gibt nur Zahlen aus (Logs sind öffentlich)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kontingent
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          from trikot import ebay
          c = ebay.Ebay(os.environ["EBAY_CLIENT_ID"], os.environ["EBAY_CLIENT_SECRET"])
          status, d = c.get("/developer/analytics/v1_beta/rate_limit/", {"api_context": "buy", "api_name": "browse"})
          print("HTTP", status)
          for api in d.get("rateLimits") or []:
              for res in api.get("resources") or []:
                  for r in res.get("rates") or []:
                      print(api.get("apiName"), res.get("name"), {k: r.get(k) for k in ("count", "limit", "remaining", "reset", "timeWindow")})
          print("quota() =", c.quota())
          PY
