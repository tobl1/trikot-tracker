name: Diagnose (temporär)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import requests, tracker
          url = "https://classic-shirts.com/product-eng-374863-2009-10-BARCELONA-SHIRT-XL.html"
          s = requests.Session(); s.headers.update({"User-Agent": tracker.UA, "Accept-Language": "en,de;q=0.8"}); s.cookies.set("localization", "DE")
          for i in range(3):
              r = s.get(url, timeout=25, allow_redirects=False)
              print("Versuch", i, r.status_code, r.headers.get("location"), len(r.text), r.headers.get("server"))
          r = s.get(url, timeout=25)
          print("mit Weiterleitung:", r.status_code, r.url, len(r.text))
          h = tracker.Http(); print("check_page:", tracker.check_page(h, url), dict(h.codes))
          PY
