# =====================================================================
# Direkt abgefragte Shops
# plattform: auto       = Shopify oder WooCommerce wird automatisch erkannt
#            cfs        = Sonderanbindung Classic Football Shirts
#            idosell    = IdoSell-Suche (Classic-Shirts)
#            smartweb   = dänisches Shopsystem (ReShirt)
#            prestashop = PrestaShop mit JSON-Suche
#            fyj        = nicht direkt, läuft über FindYourJersey mit
#            aus        = deaktiviert
# schnellcheck: nein = nur im nächtlichen Gesamtlauf abfragen
# min_zustand: 7     = Treffer mit schlechterer Note (z. B. 6/10) ausblenden
# drop: ["Fr 19:00"] = feste Drop-Zeit (deutsche Zeit), wird im Drop-Run kurz danach geprüft;
#                      Drop-Zeiten aus dem gemessenen Rhythmus kommen automatisch dazu
