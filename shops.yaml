# =====================================================================
# Direkt abgefragte Shops
# plattform: auto       = Shopify oder WooCommerce wird automatisch erkannt
#            cfs        = Sonderanbindung Classic Football Shirts
#            idosell    = IdoSell-Suche (Classic-Shirts)
#            wix        = Wix Stores (öffentliche Shop-Schnittstelle)
#            smartweb   = dänisches Shopsystem (ReShirt)
#            prestashop = PrestaShop mit JSON-Suche
#            fyj        = nicht direkt, läuft über FindYourJersey mit
#            aus        = deaktiviert
# schnellcheck: nein = nur im nächtlichen Gesamtlauf abfragen
# sperren: ja        = Shop komplett ignorieren, auch über FindYourJersey
# min_zustand: 7     = Treffer mit schlechterer Note (z. B. 6/10) ausblenden
# drop: ["Fr 19:00"] = feste Drop-Zeit (deutsche Zeit, oder mit Zeitzone: "Fr 20:00 Pacific/Auckland",
#                      oder jeden Tag: "täglich 18:00 Europe/London"),
#                      wird im Drop-Run kurz danach geprüft;
#                      Drop-Zeiten aus dem gemessenen Rhythmus kommen automatisch dazu
# Entfernt (01.10.2026): Kit Fever (Domain gehört jetzt einem Modeshop),
#                         Retro Football Kits (Shop geschlossen)
# Alle weiteren ~125 Shops laufen über FindYourJersey (fyj: an).
# Nicht automatisch erkannte Shops stehen nach jedem Lauf in TREFFER.md
# unter "Quellen-Status" und werden, falls bei FYJ gelistet, dort abgedeckt.
# =====================================================================

